name: Tauri Bundles

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin installs
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bins-v1
          restore-keys: |
            ${{ runner.os }}-cargo-bins-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            app -> target/front

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libfuse2 patchelf curl

      - name: Install system deps (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y visualstudio2022buildtools visualstudio2022-workload-vctools wixtoolset
          choco install -y strawberryperl nasm

      - name: Prefer Strawberry Perl (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install system deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install create-dmg || true

      - name: Install Tauri CLI (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --locked
          fi

      - name: Install Tauri CLI (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --locked
          }

      - name: Install cargo-leptos (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if ! command -v cargo-leptos >/dev/null 2>&1; then
            cargo install cargo-leptos --locked
          fi

      - name: Install cargo-leptos (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-leptos -ErrorAction SilentlyContinue)) {
            cargo install cargo-leptos --locked
          }

      - name: Install wasm-bindgen-cli (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install wasm-bindgen-cli --version 0.2.105 --locked
          fi

      - name: Install wasm-bindgen-cli (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command wasm-bindgen -ErrorAction SilentlyContinue)) {
            cargo install wasm-bindgen-cli --version 0.2.105 --locked
          }

      - name: Build bundles
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
